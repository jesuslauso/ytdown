<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>你管 - YouTube 下載器</title>
<meta name="description" content="你管 - 免費 YouTube 影音下載器，無廣告，支援 MP3/M4A/MP4">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--red:#ff4444;--bg:#0f0f0f;--card:#1a1a1a;--border:#333;--text:#fff;--muted:#aaa;--green:#4caf50}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center}
.wrap{width:100%;max-width:680px;padding:20px}
header{text-align:center;padding:50px 0 36px}
header h1{font-size:2.4em;font-weight:800;background:linear-gradient(135deg,#fff,#ff6b6b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
header p{color:var(--muted);margin-top:8px;font-size:0.95em}
.search{display:flex;background:var(--card);border:2px solid var(--border);border-radius:50px;overflow:hidden;transition:border-color .2s}
.search:focus-within{border-color:var(--red)}
.search input{flex:1;padding:16px 24px;background:none;border:none;color:var(--text);font-size:1em;outline:none}
.search input::placeholder{color:#666}
.search button{padding:16px 32px;background:var(--red);color:#fff;border:none;font-size:1em;font-weight:600;cursor:pointer;transition:background .2s}
.search button:hover{background:#cc0000}
.search button:disabled{background:#555;cursor:not-allowed}
#status{text-align:center;padding:16px;font-size:.9em;color:var(--muted)}
#status.err{color:var(--red)}
.card{background:var(--card);border-radius:16px;border:1px solid var(--border);margin-top:20px;display:none;animation:fadeIn .3s}
.card.show{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.vmeta{display:flex;gap:16px;padding:20px}
.vmeta img{width:180px;height:101px;border-radius:8px;object-fit:cover;flex-shrink:0;background:var(--border)}
.vmeta .info{flex:1;display:flex;flex-direction:column;justify-content:center;min-width:0}
.vmeta .info h3{font-size:.95em;font-weight:600;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vmeta .info p{font-size:.82em;color:var(--muted)}
.tabs{display:flex;padding:0 20px;gap:8px;margin-bottom:12px}
.tabs button{padding:8px 20px;border-radius:20px;border:1px solid var(--border);background:none;color:var(--muted);font-size:.9em;cursor:pointer;transition:all .2s}
.tabs button.on{background:var(--red);border-color:var(--red);color:#fff}
.fmts{padding:0 20px 20px;display:flex;flex-direction:column;gap:8px}
.fmt{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#222;border-radius:10px;border:1px solid var(--border)}
.fmt .left{display:flex;align-items:center;gap:12px}
.fmt .badge{padding:3px 10px;border-radius:6px;font-size:.78em;font-weight:700}
.fmt .badge.a{background:#1a3a1a;color:#6fbf73}
.fmt .badge.v{background:#1a1a3a;color:#6b8fff}
.fmt .qual{font-size:.88em;color:#ccc}
.fmt .btn{padding:8px 18px;border-radius:20px;border:none;background:var(--green);color:#fff;font-size:.82em;font-weight:600;cursor:pointer;transition:all .15s;min-width:80px;text-align:center}
.fmt .btn:hover{background:#45a049;transform:scale(1.03)}
.fmt .btn:disabled{background:#555;cursor:not-allowed;transform:none}
.prog{height:3px;background:var(--border);border-radius:2px;margin:4px 16px 0;overflow:hidden;display:none}
.prog.show{display:block}
.prog .bar{height:100%;background:linear-gradient(90deg,var(--red),#ff8800);border-radius:2px;width:0;transition:width .3s}
footer{text-align:center;padding:50px 0 20px;color:#555;font-size:.78em}
@media(max-width:600px){
  .vmeta{flex-direction:column}
  .vmeta img{width:100%;height:auto;aspect-ratio:16/9}
  .search{flex-direction:column;border-radius:16px}
  .search button{border-radius:0 0 14px 14px}
  header h1{font-size:1.9em}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>你管</h1>
    <p>免費下載 YouTube 音頻和影片，無廣告</p>
  </header>
  <div class="search">
    <input id="url" type="text" placeholder="貼上 YouTube 連結..." autocomplete="off">
    <button id="btn" onclick="go()">下載</button>
  </div>
  <div id="status"></div>
  <div class="card" id="card">
    <div class="vmeta">
      <img id="thumb" src="" alt="">
      <div class="info"><h3 id="title"></h3><p id="channel"></p></div>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="fmts" id="fmts"></div>
  </div>
  <footer>你管 &copy; 2024 &mdash; 僅供個人使用</footer>
</div>
<script>
const W='https://mute-smoke-da30.so64134022.workers.dev';
let D=null,tab='audio';

document.getElementById('url').addEventListener('keydown',e=>{if(e.key==='Enter')go()});

function msg(t,err){const s=document.getElementById('status');s.textContent=t;s.className=err?'err':''}

async function go(){
  const url=document.getElementById('url').value.trim();
  if(!url){msg('請輸入 YouTube 連結',1);return}
  const b=document.getElementById('btn');
  b.disabled=true;b.textContent='搜尋中...';
  msg('正在獲取影片資訊...');
  document.getElementById('card').classList.remove('show');
  try{
    const r=await fetch(W+'/audio?url='+encodeURIComponent(url));
    const d=await r.json();
    if(d.error){msg(d.error,1);return}
    D=d;
    document.getElementById('thumb').src=d.thumbnail||'';
    document.getElementById('title').textContent=d.title||'YouTube Video';
    document.getElementById('channel').textContent=d.channel||'';
    document.getElementById('card').classList.add('show');
    msg('');
    tab='audio';renderTabs();renderFmts();
  }catch(e){msg('連線失敗: '+e.message,1)}
  finally{b.disabled=false;b.textContent='下載'}
}

function renderTabs(){
  const t=document.getElementById('tabs');
  const hasAudio=D.formats.some(f=>f.type==='audio');
  const hasVideo=D.formats.some(f=>f.type==='video');
  let h='';
  if(hasAudio)h+=`<button class="${tab==='audio'?'on':''}" onclick="tab='audio';renderTabs();renderFmts()">音頻</button>`;
  if(hasVideo)h+=`<button class="${tab==='video'?'on':''}" onclick="tab='video';renderTabs();renderFmts()">影片</button>`;
  t.innerHTML=h;
}

function renderFmts(){
  const c=document.getElementById('fmts');
  const list=D.formats.filter(f=>f.type===tab);
  if(!list.length){c.innerHTML='<div style="text-align:center;padding:16px;color:#666">無可用格式</div>';return}
  c.innerHTML=list.map((f,i)=>`
    <div class="fmt" id="f${i}">
      <div class="left">
        <span class="badge ${f.type==='audio'?'a':'v'}">${(f.format||'').toUpperCase()}</span>
        <span class="qual">${f.quality||f.label||''}</span>
      </div>
      <button class="btn" id="b${i}" onclick="dl(${i})">下載</button>
    </div>
    <div class="prog" id="p${i}"><div class="bar" id="pb${i}"></div></div>
  `).join('');
}

async function dl(i){
  const list=D.formats.filter(f=>f.type===tab);
  const f=list[i];if(!f)return;
  const btn=document.getElementById('b'+i);
  const prog=document.getElementById('p'+i);
  const bar=document.getElementById('pb'+i);
  btn.disabled=true;prog.classList.add('show');bar.style.width='5%';

  try{
    if(f.mediaUrl&&D.backend==='ytdown'){
      await dlYtdown(f,btn,bar);
    }else{
      await dlLoader(f,btn,bar);
    }
    btn.textContent='完成 ✓';btn.style.background='var(--green)';
    bar.style.width='100%';
    setTimeout(()=>{btn.disabled=false;btn.textContent='下載';btn.style.background='';prog.classList.remove('show')},4000);
  }catch(e){
    btn.textContent='重試';btn.style.background='#aa3333';
    msg('下載失敗: '+e.message,1);
    setTimeout(()=>{btn.disabled=false;btn.textContent='下載';btn.style.background='';prog.classList.remove('show')},4000);
  }
}

async function dlYtdown(f,btn,bar){
  btn.textContent='獲取連結...';bar.style.width='20%';
  let fileUrl=null,fileName='download';
  const videoUrl='https://www.youtube.com/watch?v='+D.id;
  // First try: /download with videoUrl for auto-fallback to loader.to
  const dlParams=new URLSearchParams({url:f.mediaUrl,videoUrl:videoUrl,format:f.format||'mp3',quality:f.quality||'128k'});
  const r=await fetch(W+'/download?'+dlParams);
  const d=await r.json();
  if(d.status==='completed'&&d.fileUrl){
    fileUrl=d.fileUrl;fileName=d.fileName||fileName;
  }else if(d.status==='processing'&&d.pollUrl){
    // Poll ytdown
    for(let i=0;i<20;i++){
      await sleep(2000);
      const pr=await fetch(W+'/download?url='+encodeURIComponent(d.pollUrl)+'&videoUrl='+encodeURIComponent(videoUrl)+'&format='+(f.format||'mp3')+'&quality='+(f.quality||'128k'));
      const pd=await pr.json();
      if(pd.status==='completed'&&pd.fileUrl){fileUrl=pd.fileUrl;fileName=pd.fileName||fileName;break}
      btn.textContent='處理中...';bar.style.width=(20+i*2.5)+'%';
    }
  }else if(d.status==='processing'&&d.loaderId){
    // Loader.to fallback - poll progress
    btn.textContent='備用轉換中...';
    for(let i=0;i<60;i++){
      await sleep(2000);
      const pr=await fetch(W+'/progress?id='+d.loaderId);
      const pd=await pr.json();
      if(pd.status==='completed'&&pd.fileUrl){fileUrl=pd.fileUrl;fileName=(D.title||D.id)+'.'+(f.format||'mp3');break}
      if(pd.status==='failed')throw new Error('轉換失敗');
      bar.style.width=(20+(pd.progress||0)*0.6)+'%';
      btn.textContent='轉換 '+(pd.progress||0)+'%';
    }
  }else if(d.error){
    // Both backends failed in Worker, try loader.to from frontend
    btn.textContent='切換備用...';bar.style.width='30%';
    await dlLoader(f,btn,bar);
    return;
  }
  if(!fileUrl){
    btn.textContent='切換備用...';bar.style.width='30%';
    await dlLoader(f,btn,bar);
    return;
  }
  btn.textContent='下載中...';bar.style.width='70%';
  await save(W+'/stream?url='+encodeURIComponent(fileUrl)+'&filename='+encodeURIComponent(fileName),fileName);
  bar.style.width='100%';
}

async function dlLoader(f,btn,bar){
  btn.textContent='轉換中...';bar.style.width='25%';
  let fmt=f.loaderFormat||f.format||'mp3';
  if(f.type==='video'&&f.quality){
    const m=f.quality.match(/(\d+)/);
    if(m)fmt=m[1];
  }
  const r=await fetch(W+'/convert?url='+encodeURIComponent('https://www.youtube.com/watch?v='+D.id)+'&format='+fmt);
  const d=await r.json();
  if(!d.id)throw new Error(d.error||'提交失敗');
  
  let fileUrl=null;
  for(let i=0;i<60;i++){
    const pr=await fetch(W+'/progress?id='+d.id);
    const pd=await pr.json();
    if(pd.status==='completed'&&pd.fileUrl){fileUrl=pd.fileUrl;break}
    if(pd.status==='failed')throw new Error('轉換失敗');
    const pct=pd.progress||0;
    bar.style.width=(25+pct*0.6)+'%';
    btn.textContent='轉換 '+pct+'%';
    await sleep(2000);
  }
  if(!fileUrl)throw new Error('轉換超時');
  
  btn.textContent='下載中...';bar.style.width='90%';
  const name=(D.title||D.id)+'.'+(f.format||'mp3');
  await save(W+'/stream?url='+encodeURIComponent(fileUrl)+'&filename='+encodeURIComponent(name),name);
}

async function save(url,name){
  try{
    const r=await fetch(url);
    if(!r.ok)throw new Error('HTTP '+r.status);
    const b=await r.blob();
    const a=document.createElement('a');
    a.href=URL.createObjectURL(b);a.download=name;
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
  }catch(e){window.open(url,'_blank')}
}

function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
</script>
</body>
</html>
