<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>你管 — 免費 YouTube 音訊/影片下載</title>
<meta name="description" content="你管 — 免費、無廣告的 YouTube 下載工具。支援 MP3、MP4 多種格式，手機電腦均可用。">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0f0f0f;--card:#1a1a1a;--card2:#242424;--border:#333;
  --text:#e8e8e8;--text2:#aaa;--text3:#666;
  --accent:#e53935;--accent2:#ff5252;
  --green:#4caf50;--blue:#2196f3;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
a{color:var(--accent2);text-decoration:none}
a:hover{text-decoration:underline}

.header{background:linear-gradient(135deg,#1a0000,#0f0f0f 60%);border-bottom:1px solid #2a0000;text-align:center;padding:2rem 1rem 1.2rem}
.header h1{font-size:2.5rem;font-weight:800;letter-spacing:2px}
.header h1 span{color:var(--accent)}
.header .tagline{color:var(--text2);margin-top:.4rem;font-size:.9rem}
.badges{display:flex;justify-content:center;gap:.5rem;margin-top:.8rem;flex-wrap:wrap}
.badge{background:var(--card2);border:1px solid var(--border);border-radius:20px;padding:3px 10px;font-size:.75rem;color:var(--text2)}

.container{max-width:800px;width:100%;margin:0 auto;padding:1.2rem 1rem 0}

.input-box{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:1rem;margin-bottom:1rem}
.input-row{display:flex;gap:.5rem}
.input-row input{flex:1;background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:.7rem 1rem;color:var(--text);font-size:.95rem;outline:none;transition:border-color .2s;min-width:0}
.input-row input:focus{border-color:var(--accent)}
.input-row input::placeholder{color:var(--text3)}
.btn-go{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:.7rem 1.3rem;font-size:.95rem;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .2s}
.btn-go:hover{background:var(--accent2)}
.btn-go:disabled{opacity:.5;cursor:not-allowed}
.actions{display:flex;gap:.5rem;margin-top:.6rem;flex-wrap:wrap}
.btn-sm{background:var(--card2);border:1px solid var(--border);border-radius:6px;padding:4px 10px;font-size:.78rem;color:var(--text2);cursor:pointer;transition:background .2s}
.btn-sm:hover{background:#333}

.notice{display:none;padding:10px 14px;border-radius:8px;font-size:.85rem;margin-bottom:1rem;line-height:1.5}
.notice.show{display:block}
.notice.error{background:#2a0a0a;border:1px solid #aa2222;color:#ff8888}
.notice.info{background:#0a1a2a;border:1px solid #224488;color:#88bbff}
.notice.ok{background:#0a2a14;border:1px solid #226644;color:#66ffaa}

.dl-frame-box{display:none;background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:1rem}
.dl-frame-box .frame-header{background:var(--card2);padding:8px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.dl-frame-box .frame-header span{font-size:.8rem;color:var(--text2)}
.dl-frame-box .frame-header .retry-btn{background:none;border:1px solid var(--border);border-radius:4px;padding:3px 8px;font-size:.72rem;color:var(--text2);cursor:pointer}
.dl-frame-box .frame-header .retry-btn:hover{background:var(--card2);color:var(--text)}
.frame-loading{text-align:center;padding:2.5rem;color:var(--text2);font-size:.9rem}
.frame-loading .spinner{display:inline-block;width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin-right:8px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.dl-frame-box iframe{width:100%;min-height:520px;border:none;background:#fff;display:none}

.how-to{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:1rem;margin-bottom:1rem}
.how-to h3{font-size:.9rem;color:var(--text2);margin-bottom:.6rem}
.how-to ol{padding-left:1.2rem;font-size:.85rem;color:var(--text2);line-height:1.8}
.how-to ol li{margin-bottom:.2rem}

.footer{text-align:center;padding:1.5rem 1rem;color:#555;font-size:.78rem;margin-top:auto;border-top:1px solid #1a1a1a}
.footer p{margin:.2rem 0}

@media(max-width:600px){
  .header h1{font-size:1.8rem}
  .input-row{flex-direction:column}
  .btn-go{width:100%}
  .dl-frame-box iframe{min-height:600px}
}
</style>
</head>
<body>

<div class="header">
  <h1>你<span>管</span></h1>
  <p class="tagline">免費 · 無廣告 · 手機電腦均可用</p>
  <div class="badges">
    <span class="badge">MP3</span>
    <span class="badge">MP4</span>
    <span class="badge">M4A</span>
    <span class="badge">多畫質</span>
    <span class="badge">免安裝</span>
  </div>
</div>

<div class="container">
  <div class="input-box">
    <div class="input-row">
      <input type="text" id="url-input" placeholder="貼上 YouTube 連結..." autocomplete="off">
      <button class="btn-go" id="btn-go" onclick="handleGo()">🔍 解析</button>
    </div>
    <div class="actions">
      <button class="btn-sm" onclick="pasteUrl()">📋 貼上</button>
      <button class="btn-sm" onclick="clearAll()">✕ 清除</button>
    </div>
  </div>

  <div class="notice" id="notice"></div>

  <div class="dl-frame-box" id="dl-frame-box">
    <div class="frame-header">
      <span id="frame-status">正在載入...</span>
      <button class="retry-btn" onclick="retryFrame()">↻ 重試</button>
    </div>
    <div class="frame-loading" id="frame-loading"><span class="spinner"></span>正在連接下載伺服器...</div>
    <iframe id="dl-frame" sandbox="allow-scripts allow-same-origin allow-popups allow-forms allow-popups-to-escape-sandbox" referrerpolicy="no-referrer" loading="lazy"></iframe>
  </div>

  <div class="how-to" id="how-to">
    <h3>使用方式</h3>
    <ol>
      <li>複製 YouTube 影片網址</li>
      <li>貼到上方輸入框，點擊「解析」</li>
      <li>在下方選擇格式（MP3 / MP4 / 其他）</li>
      <li>點擊「Download」按鈕即可下載</li>
    </ol>
  </div>
</div>

<div class="footer">
  <p>你管 — 純前端工具，僅供個人學習用途</p>
  <p>請勿下載有版權爭議的內容</p>
</div>

<script>
const FRAME_PROVIDERS = [
  { name: 'y2meta-uk', url: vid => `https://frame.y2meta-uk.com/wwwindex.php?videoId=${vid}` },
  { name: 'y2meta-au', url: vid => `https://frame.y2meta-au.com/wwwindex.php?videoId=${vid}` },
  { name: 'y2meta-de', url: vid => `https://frame.y2meta-de.com/wwwindex.php?videoId=${vid}` },
];

const $input = document.getElementById('url-input');
const $btn = document.getElementById('btn-go');
const $notice = document.getElementById('notice');
const $frameBox = document.getElementById('dl-frame-box');
const $frame = document.getElementById('dl-frame');
const $frameLoading = document.getElementById('frame-loading');
const $frameStatus = document.getElementById('frame-status');
const $howTo = document.getElementById('how-to');

let currentVid = '';
let currentProvider = 0;

function extractVideoId(url) {
  if (!url) return null;
  url = url.trim();
  let m = url.match(/[?&]v=([a-zA-Z0-9_-]{11})/);
  if (m) return m[1];
  m = url.match(/youtu\.be\/([a-zA-Z0-9_-]{11})/);
  if (m) return m[1];
  m = url.match(/youtube\.com\/embed\/([a-zA-Z0-9_-]{11})/);
  if (m) return m[1];
  m = url.match(/youtube\.com\/shorts\/([a-zA-Z0-9_-]{11})/);
  if (m) return m[1];
  m = url.match(/music\.youtube\.com\/watch\?v=([a-zA-Z0-9_-]{11})/);
  if (m) return m[1];
  m = url.match(/^([a-zA-Z0-9_-]{11})$/);
  if (m) return m[1];
  return null;
}

function showNotice(msg, type = 'info') {
  $notice.innerHTML = msg;
  $notice.className = 'notice show ' + type;
}
function hideNotice() { $notice.className = 'notice'; }

async function pasteUrl() {
  try {
    const text = await navigator.clipboard.readText();
    $input.value = text;
    $input.focus();
  } catch (e) {
    showNotice('無法讀取剪貼簿，請手動貼上', 'error');
  }
}

function clearAll() {
  $input.value = '';
  hideNotice();
  $frameBox.style.display = 'none';
  $frame.src = '';
  $frame.style.display = 'none';
  $howTo.style.display = 'block';
  currentVid = '';
}

function handleGo() {
  const url = $input.value.trim();
  if (!url) { showNotice('請輸入 YouTube 連結', 'error'); return; }
  const vid = extractVideoId(url);
  if (!vid) { showNotice('無法識別此連結，請確認是有效的 YouTube 網址', 'error'); return; }
  hideNotice();
  currentVid = vid;
  currentProvider = 0;
  loadFrame(vid, 0);
}

function loadFrame(vid, idx) {
  if (idx >= FRAME_PROVIDERS.length) {
    showNotice('所有下載伺服器均無法連接，請稍後再試', 'error');
    $frameBox.style.display = 'none';
    return;
  }
  currentProvider = idx;
  const p = FRAME_PROVIDERS[idx];
  
  $howTo.style.display = 'none';
  $frameBox.style.display = 'block';
  $frameLoading.style.display = 'block';
  $frame.style.display = 'none';
  $frameStatus.textContent = `正在連接 ${p.name}...`;
  $btn.disabled = true;

  $frame.onload = () => {
    $frameLoading.style.display = 'none';
    $frame.style.display = 'block';
    $frameStatus.textContent = `已連接 ${p.name} · 選擇格式後點擊 Download`;
    $btn.disabled = false;
  };

  $frame.src = p.url(vid);

  // Timeout: try next provider after 20s
  setTimeout(() => {
    if ($frame.style.display === 'none' && currentVid === vid && currentProvider === idx) {
      loadFrame(vid, idx + 1);
    }
  }, 20000);
}

function retryFrame() {
  if (!currentVid) return;
  // Try next provider
  loadFrame(currentVid, (currentProvider + 1) % FRAME_PROVIDERS.length);
}

$input.addEventListener('keydown', e => { if (e.key === 'Enter') handleGo(); });

// Auto-detect from URL params
(function() {
  const params = new URLSearchParams(location.search);
  const v = params.get('v');
  if (v) {
    $input.value = `https://www.youtube.com/watch?v=${v}`;
    setTimeout(handleGo, 300);
  }
})();
</script>
</body>
</html>
